<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chrome Manager 云端控制台</title>
  <style>
    :root{--bg:#f7f5f1;--card:#fff;--text:#252321;--muted:#77716b;--line:#e7e1da;--brand:#cf775d;--danger:#b5453c;--green:#247c45}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei UI",system-ui,sans-serif}
    header{padding:18px 4vw;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    h1{font-size:22px;margin:0}h2{font-size:18px;margin:0}.wrap{max-width:1500px;margin:24px auto;padding:0 20px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 8px 30px #6b55400d}
    .login{max-width:480px;margin:70px auto}.field{display:grid;gap:7px;margin:15px 0}
    input{padding:12px;border:1px solid var(--line);border-radius:9px;font-size:15px;width:100%}
    input[type=checkbox]{width:auto}.check{display:flex;gap:8px;align-items:center}
    button{border:0;border-radius:8px;padding:10px 15px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#eee8e1;color:#4b4540}.danger{background:var(--danger)}
    .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row h2{flex:1}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
    .stat b{font-size:27px;display:block;margin-top:8px}.muted{color:var(--muted)}.error{color:#b33b2f;margin-top:12px}.hidden{display:none!important}
    .layout{display:grid;grid-template-columns:minmax(430px,.8fr) minmax(620px,1.2fr);gap:18px}
    .table-wrap{overflow:auto;max-height:620px}table{width:100%;border-collapse:collapse;min-width:650px}
    th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}th{color:var(--muted);position:sticky;top:0;background:#fff;z-index:1}
    tr.clickable{cursor:pointer}tr.clickable:hover{background:#faf2ee}.badge{padding:3px 8px;border-radius:10px;background:#e8f5ea;color:var(--green)}.badge.off{background:#f8e5e3;color:#a63d35}
    .section{margin-top:20px}.empty{padding:35px;text-align:center;color:var(--muted)}.toolbar{margin-bottom:14px}
    .resource-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.resource-box{border:1px solid var(--line);border-radius:10px;padding:12px;max-height:310px;overflow:auto}
    .resource-item{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:8px 4px;border-bottom:1px solid #f1ece6}.resource-item small{display:block;color:var(--muted);margin-top:3px}
    .notice{padding:12px 14px;border-radius:9px;background:#fff5e8;color:#7b4b1e;margin-bottom:15px}.good{background:#edf8ef;color:#256b39}
    @media(max-width:1050px){.layout,.resource-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<header>
  <h1>Chrome Manager 云端控制台</h1>
  <div class="row"><span id="account" class="muted"></span><button id="logoutBtn" class="secondary hidden" onclick="logout()">退出</button></div>
</header>
<main class="wrap">
  <section id="loginCard" class="card login">
    <h2>登录控制台</h2>
    <p class="muted">主账号可管理子账号与授权；子账号只能查看分配给自己的浏览器和网站账号。</p>
    <div class="field"><label>用户名</label><input id="username" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div>
    <button onclick="login()">登录</button>
    <div id="loginError" class="error"></div>
  </section>

  <section id="adminView" class="hidden">
    <div class="stats">
      <div class="card stat"><span class="muted">主账号</span><b id="ownerCount">0</b></div>
      <div class="card stat"><span class="muted">子账号</span><b id="adminMemberCount">0</b></div>
      <div class="card stat"><span class="muted">禁用账号</span><b id="disabledCount">0</b></div>
      <div class="card stat"><span class="muted">浏览器</span><b id="browserCount">0</b></div>
      <div class="card stat"><span class="muted">网站账号</span><b id="vaultCount">0</b></div>
    </div>
    <div class="layout">
      <div class="card">
        <div class="row toolbar"><h2>全部用户</h2><button class="secondary" onclick="loadAdmin()">刷新</button></div>
        <div class="table-wrap"><table>
          <thead><tr><th>用户名</th><th>类型</th><th>所属主账号</th><th>状态</th><th>浏览器</th><th>网站账号</th></tr></thead>
          <tbody id="adminUsers"></tbody>
        </table></div>
      </div>
      <div class="card">
        <div id="adminEmpty" class="empty">点击左侧用户查看详情</div>
        <div id="adminDetail" class="hidden">
          <div class="row"><h2 id="adminDetailTitle"></h2>
            <button id="adminToggle" class="secondary" onclick="adminToggleUser()"></button>
            <button class="secondary" onclick="adminResetPassword()">重置密码</button>
            <button class="danger" onclick="adminDeleteUser()">删除用户</button>
          </div>
          <p id="adminMeta" class="muted"></p>
          <div id="adminResources"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="ownerView" class="hidden">
    <div class="notice good">主账号可以创建子账号并分配资源。子账号在客户端和网页端均为只读，不能上传、编辑或删除配置。</div>
    <div class="layout">
      <div class="card">
        <div class="row toolbar"><h2>子账号</h2><button onclick="showCreateMember()">新建子账号</button><button class="secondary" onclick="loadOwner()">刷新</button></div>
        <div id="createMemberBox" class="hidden">
          <div class="field"><label>用户名</label><input id="newMemberUsername"></div>
          <div class="field"><label>显示名称</label><input id="newMemberDisplay"></div>
          <div class="field"><label>初始密码（至少 8 位）</label><input id="newMemberPassword" type="password"></div>
          <div class="row"><button onclick="createMember()">确定创建</button><button class="secondary" onclick="showCreateMember(false)">取消</button></div>
          <p id="memberError" class="error"></p>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>用户名</th><th>名称</th><th>状态</th><th>浏览器</th><th>网站账号</th></tr></thead>
          <tbody id="members"></tbody>
        </table></div>
      </div>
      <div class="card">
        <div id="memberEmpty" class="empty">选择一个子账号进行资源分配</div>
        <div id="memberDetail" class="hidden">
          <div class="row"><h2 id="memberTitle"></h2><button onclick="saveAssignments()">保存授权</button><button id="memberToggle" class="secondary" onclick="toggleMember()"></button><button class="secondary" onclick="resetMemberPassword()">重置密码</button><button class="danger" onclick="deleteMember()">删除</button></div>
          <p id="memberMeta" class="muted"></p>
          <div class="resource-grid">
            <div><h2 class="section">可用浏览器</h2><div id="browserAssignments" class="resource-box"></div></div>
            <div><h2 class="section">可用网站账号</h2><div id="vaultAssignments" class="resource-box"></div></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="memberView" class="hidden">
    <div class="notice">这是只读子账号。你可以查看和启动分配给自己的浏览器，但不能修改浏览器配置或网站账号。</div>
    <div class="card"><div class="row toolbar"><h2>我的授权资源</h2><button class="secondary" onclick="loadMember()">刷新</button></div><div id="memberResources"></div></div>
  </section>
</main>
<script>
let token=sessionStorage.getItem("portalToken")||"",role=sessionStorage.getItem("portalRole")||"";
let selectedAdmin=null,selectedMember=null,ownerResources={browsers:[],vault:[]};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=v=>v?new Date(v).toLocaleString():"从未";
async function api(path,options={}){
  options.headers={...(options.headers||{}),"Content-Type":"application/json",Authorization:`Bearer ${token}`};
  const response=await fetch(path,options),data=await response.json();
  if(!response.ok)throw new Error(data.detail||`HTTP ${response.status}`);return data;
}
function hideViews(){["loginCard","adminView","ownerView","memberView"].forEach(id=>document.getElementById(id).classList.add("hidden"))}
async function login(){
  try{
    const response=await fetch("/api/portal/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});
    const data=await response.json();if(!response.ok)throw new Error(data.detail);
    token=data.token;role=data.role;sessionStorage.setItem("portalToken",token);sessionStorage.setItem("portalRole",role);
    account.textContent=`${data.display_name||data.username} · ${role==="admin"?"系统管理员":role==="owner"?"主账号":"只读子账号"}`;
    logoutBtn.classList.remove("hidden");loginError.textContent="";await route();
  }catch(error){loginError.textContent=error.message}
}
async function logout(){
  try{if(token)await api("/api/logout",{method:"POST"})}catch(_){}
  token="";role="";sessionStorage.removeItem("portalToken");sessionStorage.removeItem("portalRole");
  hideViews();loginCard.classList.remove("hidden");logoutBtn.classList.add("hidden");account.textContent="";
}
async function route(){
  try{
    const me=await api("/api/me");role=me.role;sessionStorage.setItem("portalRole",role);
    account.textContent=`${me.display_name||me.username} · ${role==="admin"?"系统管理员":role==="owner"?"主账号":"只读子账号"}`;
    hideViews();logoutBtn.classList.remove("hidden");
    if(role==="admin"){adminView.classList.remove("hidden");await loadAdmin()}
    else if(role==="owner"){ownerView.classList.remove("hidden");await loadOwner()}
    else{memberView.classList.remove("hidden");await loadMember()}
  }catch(error){logout();loginError.textContent=error.message}
}
function resourceTables(data){
  const browserRows=Object.entries(data.browsers||{}).map(([key,x])=>`<tr><td>${esc(x.name||key)}</td><td>${esc(x.group)}</td><td>${esc(x.port)}</td><td>${esc(x.home)}</td><td>${esc(x.last_open_at)}</td></tr>`).join("");
  const vaultRows=(data.vault||[]).map(x=>`<tr><td>${esc(x.site)}</td><td>${esc(x.url)}</td><td>${esc(x.username)}</td><td>${esc(x.password)}</td><td>${esc(x.note)}</td></tr>`).join("");
  return `<h2 class="section">浏览器</h2><div class="table-wrap" style="max-height:280px"><table><thead><tr><th>名称</th><th>分组</th><th>端口</th><th>首页</th><th>上次打开</th></tr></thead><tbody>${browserRows}</tbody></table></div><h2 class="section">网站账号</h2><div class="table-wrap" style="max-height:300px"><table><thead><tr><th>网站</th><th>网址</th><th>账号</th><th>密码</th><th>备注</th></tr></thead><tbody>${vaultRows}</tbody></table></div>`;
}
async function loadAdmin(){
  const [summary,list]=await Promise.all([api("/api/admin/summary"),api("/api/admin/users")]);
  ownerCount.textContent=summary.owner_count;adminMemberCount.textContent=summary.member_count;disabledCount.textContent=summary.disabled_count;browserCount.textContent=summary.browser_count;vaultCount.textContent=summary.vault_count;
  adminUsers.innerHTML=list.users.map(x=>`<tr class="clickable" onclick="showAdminUser(${x.id})"><td>${esc(x.username)}</td><td>${x.role==="owner"?"主账号":"子账号"}</td><td>${esc(x.owner_username||"-")}</td><td><span class="badge ${x.disabled?"off":""}">${x.disabled?"已禁用":"正常"}</span></td><td>${x.browser_count}</td><td>${x.vault_count}</td></tr>`).join("");
}
async function showAdminUser(id){
  const data=await api(`/api/admin/users/${id}`);selectedAdmin=data.user;adminEmpty.classList.add("hidden");adminDetail.classList.remove("hidden");
  adminDetailTitle.textContent=data.user.username;adminToggle.textContent=data.user.disabled?"启用账号":"禁用账号";
  adminMeta.textContent=`类型：${data.user.role==="owner"?"主账号":"子账号"}　注册：${date(data.user.created_at)}　最近同步：${date(data.updated_at)}`;
  adminResources.innerHTML=resourceTables(data);
}
async function adminToggleUser(){if(!selectedAdmin)return;await api(`/api/admin/users/${selectedAdmin.id}/toggle-disabled`,{method:"POST"});await loadAdmin();await showAdminUser(selectedAdmin.id)}
async function adminResetPassword(){if(!selectedAdmin)return;const value=prompt("请输入新密码（至少 8 位）");if(value===null)return;if(value.length<8)return alert("密码至少 8 位");await api(`/api/admin/users/${selectedAdmin.id}/password`,{method:"PUT",body:JSON.stringify({password:value})});alert("密码已重置，原登录会话已退出。")}
async function adminDeleteUser(){if(!selectedAdmin||!confirm(`确定删除 ${selectedAdmin.username}？主账号的子账号也会一并删除。`))return;await api(`/api/admin/users/${selectedAdmin.id}`,{method:"DELETE"});selectedAdmin=null;adminDetail.classList.add("hidden");adminEmpty.classList.remove("hidden");await loadAdmin()}
function showCreateMember(show=true){createMemberBox.classList.toggle("hidden",!show);if(show)newMemberUsername.focus()}
async function createMember(){
  try{await api("/api/organization/members",{method:"POST",body:JSON.stringify({username:newMemberUsername.value,password:newMemberPassword.value,display_name:newMemberDisplay.value})});newMemberUsername.value="";newMemberPassword.value="";newMemberDisplay.value="";memberError.textContent="";showCreateMember(false);await loadOwner()}
  catch(error){memberError.textContent=error.message}
}
async function loadOwner(){
  const [list,resources]=await Promise.all([api("/api/organization/members"),api("/api/organization/resources")]);ownerResources=resources;
  members.innerHTML=list.members.map(x=>`<tr class="clickable" onclick="showMember(${x.id})"><td>${esc(x.username)}</td><td>${esc(x.display_name)}</td><td><span class="badge ${x.disabled?"off":""}">${x.disabled?"已禁用":"正常"}</span></td><td>${x.browser_count}</td><td>${x.vault_count}</td></tr>`).join("");
}
async function showMember(id){
  const data=await api(`/api/organization/members/${id}`);selectedMember=data;memberEmpty.classList.add("hidden");memberDetail.classList.remove("hidden");
  memberTitle.textContent=data.member.display_name||data.member.username;memberMeta.textContent=`登录名：${data.member.username}　创建：${date(data.member.created_at)}`;
  memberToggle.textContent=data.member.disabled?"启用账号":"禁用账号";
  browserAssignments.innerHTML=ownerResources.browsers.length?ownerResources.browsers.map(x=>`<label class="resource-item"><input type="checkbox" name="browserAssign" value="${esc(x.key)}" ${data.browser_keys.includes(x.key)?"checked":""}><span><b>${esc(x.name)}</b><small>${esc(x.group)} · CDP ${esc(x.port)}</small></span></label>`).join(""):'<div class="empty">主账号尚未上传浏览器</div>';
  vaultAssignments.innerHTML=ownerResources.vault.length?ownerResources.vault.map(x=>`<label class="resource-item"><input type="checkbox" name="vaultAssign" value="${esc(x.key)}" ${data.vault_keys.includes(x.key)?"checked":""}><span><b>${esc(x.site||x.url)}</b><small>${esc(x.username)} · ${esc(x.browser_key||"未指定浏览器")}</small></span></label>`).join(""):'<div class="empty">主账号尚未上传网站账号</div>';
}
async function saveAssignments(){if(!selectedMember)return;const browser_keys=[...document.querySelectorAll('[name=browserAssign]:checked')].map(x=>x.value),vault_keys=[...document.querySelectorAll('[name=vaultAssign]:checked')].map(x=>x.value);await api(`/api/organization/members/${selectedMember.member.id}/assignments`,{method:"PUT",body:JSON.stringify({browser_keys,vault_keys})});alert("授权已保存");await loadOwner();await showMember(selectedMember.member.id)}
async function toggleMember(){if(!selectedMember)return;await api(`/api/organization/members/${selectedMember.member.id}`,{method:"PUT",body:JSON.stringify({display_name:selectedMember.member.display_name,disabled:!selectedMember.member.disabled})});await loadOwner();await showMember(selectedMember.member.id)}
async function resetMemberPassword(){if(!selectedMember)return;const value=prompt("请输入子账号新密码（至少 8 位）");if(value===null)return;if(value.length<8)return alert("密码至少 8 位");await api(`/api/organization/members/${selectedMember.member.id}/password`,{method:"PUT",body:JSON.stringify({password:value})});alert("密码已重置")}
async function deleteMember(){if(!selectedMember||!confirm(`确定删除子账号 ${selectedMember.member.username}？`))return;await api(`/api/organization/members/${selectedMember.member.id}`,{method:"DELETE"});selectedMember=null;memberDetail.classList.add("hidden");memberEmpty.classList.remove("hidden");await loadOwner()}
async function loadMember(){const data=await api("/api/sync");memberResources.innerHTML=resourceTables(data)}
if(token)route();
window.addEventListener("unhandledrejection",event=>{event.preventDefault();alert(event.reason?.message||"操作失败，请刷新后重试。")});
</script>
</body>
</html>
